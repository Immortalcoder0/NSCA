# NSCA CI pipeline — 00-master-plan.md §7, TECH-STACK.md §16.
#
# Backend Track B owns this pipeline's definition (backend-02 §5 M5); each
# track is responsible for its own code passing it. Placed at
# nsca/.github/workflows/ci.yml because this checkout treats `nsca/` as the
# repository root (00-master-plan.md's repo diagram shows `.github/workflows/`
# directly under `nsca/`, alongside `engine/`, `platform/`, `frontend/`,
# `knowledge/`) — there is no repository above `nsca/` in this checkout, and
# no `.git` at all yet (a fresh `git init` at `nsca/` would need to happen
# before this workflow could actually run on GitHub Actions; it has been
# validated by running every command below manually instead — see the M5
# report for exact commands and pass/fail counts).
#
# Two jobs minimum per the M5 task brief: engine tests, platform tests (with
# a real Postgres service container). A third, best-effort frontend job is
# included since `nsca/frontend/` exists in this checkout with a real
# `package.json`/`vitest` suite — if a future checkout doesn't have a
# frontend yet, this job's `if: hashFiles(...)` guard makes it a no-op
# rather than a hard failure.

name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: nsca

jobs:
  # ---------------------------------------------------------------------
  # Backend Track A — engine/
  # ---------------------------------------------------------------------
  engine-tests:
    name: Engine tests (gates + lint/type)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine (with dev extras)
        working-directory: nsca/engine
        run: pip install -e ".[dev]"

      - name: ruff (lint)
        working-directory: nsca/engine
        run: ruff check nsca_engine

      - name: mypy --strict
        working-directory: nsca/engine
        run: mypy nsca_engine

      # gate_g1_determinism, gate_g4_independence, gate_import_boundary and
      # gate_determinism_golden_set (00-master-plan.md §7) are real pytest
      # modules under nsca_engine/tests/ (test_gate_g1_determinism.py,
      # test_gate_g4_independence.py, test_gate_import_boundary.py,
      # test_golden_set.py) — collected and run as part of the normal suite
      # below, not a separate step; PYTHONHASHSEED=0 matches the
      # determinism-hardening convention used throughout M5's manual runs.
      - name: pytest (full suite, incl. the four gate modules)
        working-directory: nsca/engine
        env:
          PYTHONHASHSEED: "0"
        run: pytest -m "" -q

      # Real performance benchmarks (test_performance.py's NFR-PERF-001/003)
      # are deselected by default (pyproject.toml's `addopts = "-m 'not perf'"`)
      # — run explicitly, best-effort, so a slow CI runner doesn't flake the
      # required-green job above; not treated as a blocking gate here.
      - name: pytest -m perf (best-effort, non-blocking)
        working-directory: nsca/engine
        continue-on-error: true
        run: pytest -m perf -q

  # ---------------------------------------------------------------------
  # Backend Track B — platform/ (real Postgres service container)
  # ---------------------------------------------------------------------
  platform-tests:
    name: Platform tests (lint/type + real Postgres)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: nsca
          POSTGRES_PASSWORD: nsca
          POSTGRES_DB: nsca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nsca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nsca:nsca@localhost:5432/nsca
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # nsca_engine is a workspace-local dependency (platform/pyproject.toml's
      # own comment: "This monorepo has no workspace tool yet ... install
      # order matters") — engine installs first, unconditionally, before
      # platform/'s own dev extras.
      - name: Install engine
        working-directory: nsca/engine
        run: pip install -e .

      - name: Install platform (with dev extras)
        working-directory: nsca/platform
        run: pip install -e ".[dev]"

      # Both ruff and mypy are scoped to services/+learning/ (plus
      # remediation/, audit/, and the M5-added api/admin.py, main.py,
      # knowledge_base_loader.py — the files this milestone actually
      # touched) rather than the whole nsca_platform tree, per
      # 00-master-plan.md §7's own gate definition ("mypy --strict on
      # engine/ and platform/nsca_platform/{services,learning}"). The rest
      # of the package (api/'s other routers, db/, reporting/,
      # knowledge_import/) has real, pre-existing ruff violations from
      # M0-M4 (confirmed by running `ruff check nsca_platform` whole-tree
      # manually: ~140 remaining findings outside this scope, mostly in
      # nsca_platform/tests/) that this milestone's task — wiring real
      # engine calls, not a repo-wide lint pass — does not attempt to clean
      # up. Widening this gate to the whole tree is a real, flagged
      # follow-up, not silently done here or silently left uncommented.
      - name: ruff (lint — services/, learning/, remediation/, audit/, and this milestone's other touched files)
        working-directory: nsca/platform
        run: ruff check nsca_platform/services nsca_platform/learning nsca_platform/remediation nsca_platform/audit nsca_platform/knowledge_base_loader.py nsca_platform/main.py nsca_platform/api/admin.py

      - name: mypy --strict (services/ + learning/)
        working-directory: nsca/platform
        run: mypy

      - name: pytest (real Postgres)
        working-directory: nsca/platform
        env:
          PYTHONHASHSEED: "0"
        run: pytest -q

  # ---------------------------------------------------------------------
  # Frontend — nsca/frontend/ (best-effort: no-op if it doesn't exist in a
  # given checkout; real and required if it does, since it does here)
  # ---------------------------------------------------------------------
  frontend-checks:
    name: Frontend lint/typecheck/test
    runs-on: ubuntu-latest
    if: ${{ hashFiles('nsca/frontend/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nsca/frontend/package-lock.json

      - name: npm ci
        working-directory: nsca/frontend
        run: npm ci

      # No eslint config exists in this checkout yet (00-master-plan.md §7's
      # frontend gate row lists `eslint`, `tsc --noEmit`, an `axe` a11y
      # check — none of eslint/axe are wired up as of M5; flagged here as a
      # real, honestly-reported gap rather than silently invented or
      # silently dropped from the workflow). This step is conditional and
      # non-blocking specifically so adding a real eslint config later
      # makes it start enforcing with zero workflow changes.
      - name: eslint (best-effort — no config present in this checkout yet)
        working-directory: nsca/frontend
        run: |
          if [ -f .eslintrc.cjs ] || [ -f .eslintrc.json ] || [ -f eslint.config.js ] || [ -f eslint.config.mjs ]; then
            npx eslint .
          else
            echo "No ESLint config found under nsca/frontend/ — skipping (see workflow comment)."
          fi

      # `tsc -b` is the project's own `build` script's typecheck stage
      # (package.json: "build": "tsc -b && vite build") — run directly here
      # so a broken build fails this job without needing a full Vite
      # production build.
      - name: tsc --noEmit (typecheck)
        working-directory: nsca/frontend
        run: npx tsc -b --noEmit

      - name: vitest (component tests)
        working-directory: nsca/frontend
        run: npm test

      # axe a11y check on changed routes (00-master-plan.md §7) is not
      # wired up in this checkout — no axe-core/@axe-core/playwright
      # dependency, no route-diffing tooling exists yet. Flagged, not
      # silently invented; a real follow-up, not part of this job.
