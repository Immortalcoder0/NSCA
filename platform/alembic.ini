[alembic]
script_location = nsca_platform/db/migrations
prepend_sys_path = .
version_path_separator = os

# Overridden at runtime by env.py from the DATABASE_URL env var; this is
# just a documented local default for `alembic` CLI usage outside Docker.
sqlalchemy.url = postgresql+psycopg://nsca:nsca@localhost:5432/nsca

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
