!
version 15.2
service password-encryption
hostname EDGE-FW-01
!
no ip http server
ip domain-name corp.example.com
!
object-group network Partners
 network-object any
object-group network Trusted-Admins
 group-object Partners
ip access-list extended outside-in
 permit tcp object-group Trusted-Admins 10.0.20.0 0.0.0.255 eq 22
 deny ip any any
!
interface GigabitEthernet0/0
 ip address 203.0.113.1 255.255.255.0
 ip access-group outside-in in
!
interface GigabitEthernet0/1
 ip address 10.0.9.1 255.255.255.252
!
ip route 10.0.20.0 255.255.255.0 10.0.9.2
!
line vty 0 4
 transport input telnet ssh
 exec-timeout 5 0
!
end
