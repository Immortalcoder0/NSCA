#config-version=FGT60E-7.0
config system global
    set admin-telnet disable
    set admin-https-redirect enable
    set admin-sport 443
end
config firewall policy
    edit 1
        set srcintf "wan1"
        set dstintf "lan"
        set action accept
        set logtraffic all
    next
end
config log syslogd setting
    set status enable
    set server "10.0.0.50"
end
